{% if site.visitor_map_id and site.visitor_map_id != empty %}
<div id="map-container" aria-label="Visitor locations" style="width: 300px; max-width: 100%; margin: 2em auto;">
  <script async id="mapmyvisitors" src="https://mapmyvisitors.com/map.js?d={{ site.visitor_map_id | url_encode }}&amp;cl=ffffff&amp;w=a"></script>
  <noscript>
    <a href="https://mapmyvisitors.com/web/1c9id" aria-label="Homepage visitor statistics">
      <img src="https://mapmyvisitors.com/map.png?d={{ site.visitor_map_id | url_encode }}&amp;cl=ffffff&amp;w=300" alt="World map of homepage visitors" width="300" style="max-width: 100%; height: auto;">
    </a>
  </noscript>
</div>
{% endif %}
